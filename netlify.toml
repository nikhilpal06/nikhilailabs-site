[functions]
  directory = "netlify/functions"

# Studly support is CANONICAL on the Vercel host (generated from the Studly
# repo's docs/PRIVACY.md by web/build.mjs, and referenced by App Store Connect).
# Never restate support/policy content here — redirect so the two can't drift.
[[redirects]]
  from = "/studly/support"
  to = "https://web-nikhil-ai-tools.vercel.app/support/"
  status = 301
  force = true

[[redirects]]
  from = "/studly/support/*"
  to = "https://web-nikhil-ai-tools.vercel.app/support/"
  status = 301
  force = true

# Free guides: the PDFs are only linked after an email sign-up, so keep them out of search results.
[[headers]]
  for = "/guides/files/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Free guides moved to one Kit landing page + Notion library (Oct 2026). Old guide links,
# including /guides/?g=<slug>, go there. The old PDFs under /guides/files/ keep working.
[[redirects]]
  from = "/guides"
  to = "https://nikhilailabs.kit.com/guides"
  status = 301
  force = true

[[redirects]]
  from = "/guides/index.html"
  to = "https://nikhilailabs.kit.com/guides"
  status = 301
  force = true
